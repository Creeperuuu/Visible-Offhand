name: Build Minecraft 26.1.2

on:
  push:
    branches:
      - port/minecraft-26.1.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v6
        with:
          name: visible-offhand-minecraft-26.1.2
          path: build/libs/*-Fabric.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload all build outputs
        uses: actions/upload-artifact@v6
        with:
          name: visible-offhand-build-outputs
          path: build/libs/*
          if-no-files-found: error
          retention-days: 30
